<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <header class="topbar">
    <div class="clock">
      <div id="time" class="time"></div>
      <div id="date" class="date"></div>
    </div>
    <input id="search" class="search" type="search" data-i18n-placeholder="searchPlaceholder" autocomplete="off">
    <div class="actions">
      <button id="btn-done-editing" class="btn primary" data-i18n="doneEditing" hidden></button>
      <button id="btn-new-group" class="btn primary" data-i18n="newGroup"></button>
      <button id="btn-menu" class="btn icon" data-i18n-title="more">⋯</button>
      <div id="menu" class="menu" hidden>
        <button data-action="edit-layout" data-i18n="editLayout"></button>
        <button data-action="settings" data-i18n="settings"></button>
        <button data-action="export" data-i18n="exportJson"></button>
        <button data-action="import" data-i18n="importJson"></button>
      </div>
      <input id="import-file" type="file" accept="application/json" hidden>
    </div>
  </header>

  <main id="groups" class="groups"></main>

  <!-- Filled in by newtab.js (the "+ New Group" label is shown in bold) -->
  <p id="empty" class="empty" hidden></p>

  <!-- Add / rename group -->
  <dialog id="dlg-group" class="dialog">
    <form method="dialog">
      <h2 id="dlg-group-title"></h2>
      <label><span data-i18n="groupName"></span>
        <input name="name" required maxlength="40" autocomplete="off">
      </label>
      <label id="group-type-field"><span data-i18n="groupType"></span>
        <select name="type">
          <option value="sites" data-i18n="groupTypeSites"></option>
          <option value="todo" data-i18n="groupTypeTodo"></option>
        </select>
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn" data-close data-i18n="cancel"></button>
        <button value="ok" class="btn primary" data-i18n="save"></button>
      </div>
    </form>
  </dialog>

  <!-- Add / edit site -->
  <dialog id="dlg-site" class="dialog">
    <form method="dialog">
      <h2 id="dlg-site-title"></h2>
      <label><span data-i18n="siteUrl"></span>
        <input name="url" required data-i18n-placeholder="siteUrlPlaceholder" autocomplete="off">
      </label>
      <label><span data-i18n="siteTitle"></span>
        <input name="title" maxlength="60" data-i18n-placeholder="siteTitlePlaceholder" autocomplete="off">
      </label>
      <label><span data-i18n="siteGroup"></span>
        <select name="group"></select>
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn" data-close data-i18n="cancel"></button>
        <button value="ok" class="btn primary" data-i18n="save"></button>
      </div>
    </form>
  </dialog>

  <!-- Settings -->
  <dialog id="dlg-settings" class="dialog">
    <form method="dialog">
      <h2 data-i18n="settingsTitle"></h2>
      <div class="setting">
        <label class="setting-label" for="lang-select" data-i18n="language"></label>
        <select id="lang-select" class="setting-select"></select>
      </div>
      <div class="setting">
        <span class="setting-label" data-i18n="bgColor"></span>
        <div id="bg-swatches" class="swatches"></div>
        <div class="setting-row">
          <label class="color-picker" data-i18n-title="customColorTitle">
            <input id="bg-custom" type="color">
            <span data-i18n="customColor"></span>
          </label>
          <button type="button" id="bg-reset" class="btn" data-i18n="resetDefault"></button>
        </div>
      </div>
      <div class="dialog-actions">
        <button value="ok" class="btn primary" data-i18n="close"></button>
      </div>
    </form>
  </dialog>

  <script src="i18n.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
